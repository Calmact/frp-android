name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11 (JDK 8 javac chokes on MODULE attribute of modern jars)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Preprocess bundled AARs (class -> dex inside classes.jar)
        run: |
          D8=$(find /usr/local/lib/android/sdk/build-tools -name d8 | sort -V | tail -1)
          AJAR=$(ls /usr/local/lib/android/sdk/platforms/android-3*/android.jar | sort -V | tail -1)
          echo "d8=$D8 android.jar=$AJAR"
          python3 tools/preprocess_aar.py "$D8" "$AJAR" app/src/main/assets/lib_versions/*/frp.aar

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: frp-android-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
